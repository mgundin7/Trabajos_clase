<style>
.oculto{ display: none}

.visible {display:baock}

</style>


<body>
<div class="container">
    <div class="mb-3">
        <label for="nom" class="form-label">Nom</label>
        <input type="text" class="form-control" id="nom">
    </div>
    <div class="mb-3">
        <label for="pass" class="form-label">contraseña</label>
        <input type="password" class="form-control" id="pass">
    </div>
    <div class="mb-3">
        <label for="repeat" class="form-label">Repetir contraseña</label>
        <input type="password" class="form-control" id="repeat">
    </div>

    <div id="colores">
        <p>Bloque de colores</p>
    </div>

    <div>
        <button type="button" id="boton1">Boton 1</button>
    </div>

    <div>
        <button type="button" id="boton2">Boton 2</button>
    </div>

    <div>
        <label for="X">X:</label>
        <input type="text" name="x" id="idx">
    </div>

    <div>
        <label for="Y">Y:</label>
        <input type="text" name="y" id="idy">
    </div>

    <div class="oculto" id="fitxa1">Hola, soy el bloque 1</div>

    <div class="oculto" id="fitxa2">Hola, soy el bloque 2</div>

    <div class="oculto" id="fitxa3">Hola, soy el bloque 3</div>

    <div>
        <h3>textoarea</h3>
        <Textarea id="textoarea"></Textarea>
        <p id="contador">Numero de caracteres: 0</p>
    </div>

    <div>
        <label for="texto7">Texto: </label>
        <input type="text" name="texto8" id="texto8">
        <label for="numero8">Numero: </label>
        <input type="number" name="numero8" id="numero8">
    </div>
</div>
</body>
