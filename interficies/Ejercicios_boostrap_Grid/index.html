<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width">
    <title>Bootstrap Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<style>
    .box {
        min-height: 100px;
    }
    .max {
        min-height: 300;
        background-color: grey;
    }
    div{
        outline: 1px solid black;
    }
</style>
<body>
    <div class="container">
        <div class="row box">
            <div class="col bg-danger"></div>
        </div>
            <div class="row">
                <div class="box col-md-3 col-sm-2 col-12 bg-secondary"></div>
                <div class="col-md-9 col-sm-10 col-12">
                    <div class="row box">
                        <div class="col-md-3 col-sm-4 col-12 bg-primary"></div>
                        <div class="col-md-3 col-sm-4 col-12 bg-primary"></div>
                        <div class="col-md-6 col-sm-4 col-12 bg-primary"></div>
                    </div>
                    <div class="row box">
                        <div class="col-md-6 col-sm-12 " style="background-color: pink;"></div>
                        <div class="col-md-6 col-sm-12 " style="background-color: pink;"></div>
                    </div>
                    <div class="row box">
                        <div class="col-md-2 col-sm-4 col-6" style="background-color: greenyellow;"></div>
                        <div class="col-sm-4 col-6" style="background-color: greenyellow;"></div>
                        <div class="col-sm-4 col-6" style="background-color: greenyellow;"></div>
                        <div class="col-md-2 col-sm-4 col-6" style="background-color: greenyellow;"></div>

                        <div class="col-md-2 col-sm-4 col-6" style="background-color: greenyellow;"></div>
                        <div class="col-sm-4 col-6" style="background-color: greenyellow;"></div>
                        <div class="col-sm-4 col-6" style="background-color: greenyellow;"></div>
                        <div class="col-md-2 col-sm-4 col-6 d-sm-none d-md-block" style="background-color: greenyellow;"></div>
                    </div>
                </div>
                
            </div>
    </div>
</body>
</html>
