<style>
    .box {
        min-height: 100px;
    }

    .linea {
        min-height: 5px;
    }

    .medio {
        min-height: 50px;
    }

    .container {
        outline: 1px solid black;

</style>

<body>

            <div class="box col-4" style="background-color: blue;"></div>
        </div>
        <div class="row">
            <div class="box col-12" style="background-color: lightgray;"></div>
        </div>
        <div class="row">
            <div class="box col-12 linea" style="background-color: black;"></div>
            <div class="box col-12 medio" style="background-color: lightgray;"></div>
        </div>
        <div class="row">
            <div class="box col-4" style="background-color: red;"></div>

        </div>
        <div class="row">

            <div class="box col-4" style="background-color: yellow;"></div>
            <div class="box col-4" style="background-color: blue;"></div>

    <div class="container">
        <div class="row">
            <div class="col-6">

                    <div class="box col-4" style="background-color: red;"></div>
                    <div class="box col-4" style="background-color: yellow;"></div>
                    <div class="box col-4" style="background-color: blue;"></div>
                </div>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-6">
                <div class="row">
                    <div class="box col-4" style="background-color: red;"></div>
                    <div class="box col-4" style="background-color: yellow;"></div>
                    <div class="box col-4" style="background-color: blue;"></div>
                </div>
            </div>
        </div>
        <div class="row justify-content-end">
            <div class="col-6">
                <div class="row">
                    <div class="box col-4" style="background-color: red;"></div>
                    <div class="box col-4" style="background-color: yellow;"></div>
                    <div class="box col-4" style="background-color: blue;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">

                <div class="box col-12" style="background-color: red;"></div>

            <div class="col-2"></div>

        <div class="row" justify-content-around>

                <div class="row">
                    <div class="box col-12" style="background-color: red;"></div>

            </div>
            <div class="col-3">

                    <div class="box col-12" style="background-color: grey;"></div>

            </div>
            <div class="col-2">

                    <div class="box col-12" style="background-color: blue;"></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="row">
                    <div class="box col-12" style="background-color: grey;"></div>
                </div>
            </div>
        </div>
