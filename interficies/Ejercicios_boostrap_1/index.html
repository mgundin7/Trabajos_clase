<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width">
    <title>Blank page Bootstrap 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<style>
    .box {
        min-height: 100px;
        outline: 3px solid black;
    }
</style>

<body>
    <div class="container">
        <div class="row">
            <div class="box col-12" style="background-color:purple"></div>
        </div>
        <div class="row">
            <div class="box col-5" style="background-color: blue;"></div>

            <div class="col-7">
                <div class="row">
                    <div class="box col-4" style="background-color: red;"></div>
                    <div class="box col-4" style="background-color: yellow;"></div>
                    <div class="box col-4" style="background-color: green;"></div>
                </div>

                <div class="row">
                    <div class="box col-12" style="background-color:orange"></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="box col-4" style="background-color: purple;"></div>
            <div class="col-8">
                <div class="row">
                    <div class="box col-12" style="background-color: green;"></div>
                </div>
                <div class="row">
                    <div class="box col-12" style="background-color: yellow;"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
