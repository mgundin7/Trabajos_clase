<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let nombre = "Marcos";
    let apellido = "Gundin";
    
    let saludo = `Hola, ${nombre} ${apellido}. Tienes acceso al sistema.`;

    console.log(saludo);
    let texto = " aprender javascript es genial ";
    console.log(texto.trim().toUpperCase().replace("genial", "increible"));


    let animals = ["Perro", "Gato", "Conejo", "Tortuga"];
    console.log(animals);
    animals.push("Hamster");
    animals.unshift("Loro");
    console.log(animals);

    animals.pop();
    animals.shift();
    console.log(animals);

    let subarray = animals.slice(1,3);
    console.log(subarray);

    for (let i = 0; i < animals.length; i++) {
        console.log(animals[i]);
    }

    animals.forEach(animal => {
        console.log(animal.toUpperCase())
    });

    let numbers = [7, 14, 22, 31, 4];
    let mayorde20 = numbers.filter(function(num){
        return num > 20;
    });

    let multpor3 = numbers.map(function(num) {
        return num * 3;
    });

    let algunomayorde10 = numbers.some(function(num){
        return num > 10;
    });

    console.log(numbers);
    console.log(mayorde20);
    console.log(multpor3);
    console.log(algunomayorde10);

    const multiplicacion = (a,b) => a * b;
    console.log(multiplicacion(3,5));

    const isAdult = (age) => age > 18;
    console.log(isAdult(19));

    const numerorandom = () => Math.floor(Math.random() * 10) + 1;
    console.log(numerorandom());

    let students = ["Ana", "Carlos", "Marta", "Pablo", "Cristina"];
    console.log(students);

    let classList = students.join(", ");
    console.log(classList);

    let shortNames = students.filter((name) => name.length < 5);
    console.log(shortNames);

    let upperNames = students.map((name) => name.toUpperCase());
    console.log(upperNames);
    </script>
</body>
</html>
